# SENGKODE — GitLab CI/CD Pipeline
#
# Three quality gates run on every push and merge request:
#
#   build             → assembleDebug (compilation gate)
#   test              → all unit tests across every module
#   release-validation → assembleRelease (R8 + ProGuard gate)
#
# Restrictions (privacy-first contract):
#   - No APK is uploaded or published automatically.
#   - No deployment to Play Store or any distribution channel.
#   - No emulator is launched; all tests are JVM / Robolectric.

default:
  image: "eclipse-temurin:17-jdk"
  # Restore the Gradle home cache between jobs and pipelines.
  # The key includes the version catalog so a dependency change
  # invalidates the cache automatically.
  cache:
    key:
      files:
        - gradle/libs.versions.toml
        - gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle/
      - ~/.gradle/caches/
      - ~/.gradle/wrapper/
    policy: pull-push

# ── Global settings ────────────────────────────────────────────────────────────
variables:
  # Gradle daemon is useless inside ephemeral CI containers.
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
  # Android SDK is pre-installed on the runner via the android image below;
  # override the path if your runner uses a different location.
  ANDROID_SDK_ROOT: "/android-sdk"

# Use the official Android + JDK 17 image for all jobs.
# eclipse-temurin:17-jdk is the base; the android layer adds the SDK.
image: "eclipse-temurin:17-jdk"

stages:
  - build
  - test
  - release-validation

# ── Stage 1: build ─────────────────────────────────────────────────────────────
assemble-debug:
  stage: build
  script:
    - chmod +x gradlew
    - ./gradlew assembleDebug --stacktrace
  artifacts:
    name: "debug-build-${CI_COMMIT_SHORT_SHA}"
    when: always
    expire_in: 7 days
    paths:
      # Build reports (not the APK itself — no automatic distribution).
      - "**/build/reports/"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'

# ── Stage 2: test ──────────────────────────────────────────────────────────────
unit-tests:
  stage: test
  needs: ["assemble-debug"]
  script:
    - chmod +x gradlew
    # Run every :module:test task across the project.
    # --continue ensures all modules report before the job fails,
    # so the artifact upload captures every test report.
    - ./gradlew test --continue --stacktrace
  artifacts:
    name: "test-reports-${CI_COMMIT_SHORT_SHA}"
    when: always
    expire_in: 14 days
    paths:
      - "**/build/reports/tests/"
      - "**/build/test-results/"
    reports:
      # GitLab parses JUnit XML and surfaces failures inline on MRs.
      junit: "**/build/test-results/**/*.xml"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'

# ── Stage 3: release-validation ────────────────────────────────────────────────
assemble-release:
  stage: release-validation
  needs: ["unit-tests"]
  script:
    - chmod +x gradlew
    # assembleRelease runs R8 full-mode minification with the ProGuard
    # rules added in Phase 5. A failure here means a keep rule is missing
    # or a dependency was stripped. The APK is NOT uploaded anywhere.
    - ./gradlew assembleRelease --stacktrace
  artifacts:
    name: "release-build-reports-${CI_COMMIT_SHORT_SHA}"
    when: always
    expire_in: 7 days
    paths:
      # Build reports only — the APK itself is excluded intentionally.
      - "**/build/reports/"
      - "app/build/outputs/mapping/"
  rules:
    # Release validation runs on main and release branches only.
    # It is skipped on feature branches to keep MR pipelines fast.
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
